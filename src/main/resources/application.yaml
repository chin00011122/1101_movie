spring:
  application:
    name: umc-movie

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/umc_movie?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# JWT settings must be root-level properties because JwtUtil reads jwt.*.
jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600}
